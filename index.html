<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valley RP · Staff Control Center</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600&family=Share+Tech+Mono&display=swap');

  :root {
    --sky:       #4aa3df;
    --sky-dark:  #1d6b9e;
    --sand:      #d4a359;
    --gold:      #e8a832;
    --gold-dark: #b37a10;
    --wood:      #4a2e18;
    --night:     #080d12;
    --night2:    #0f1721;
    --night3:    #15222f;
    --border:    #22384b;
    --danger:    #e84040;
    --warn:      #e8a832;
    --ok:        #4ec97b;
    --text:      #f0e6d2;
    --muted:     #8ca6b8;
    --mono:      'Share Tech Mono', monospace;
    --serif:     'Playfair Display', Georgia, serif;
    --sans:      'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 80px;
    background-image: radial-gradient(circle at 50% 0%, #15293d 0%, var(--night) 75%);
  }

  #mainContent { width: 100%; display: flex; flex-direction: column; align-items: center; }

  .hero { width: 100%; max-width: 680px; text-align: center; padding: 40px 24px 24px; display: flex; flex-direction: column; align-items: center; }
  
  .logo-container {
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.7));
  }
  .logo-text {
    font-family: var(--serif);
    font-size: clamp(42px, 8vw, 64px);
    font-weight: 900;
    font-style: italic;
    background: linear-gradient(180deg, #fff2cc 0%, var(--gold) 60%, #b37a10 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
    letter-spacing: -1px;
  }
  .logo-sub {
    font-family: var(--serif);
    font-size: clamp(14px, 2.5vw, 19px);
    font-weight: 700;
    font-style: italic;
    color: var(--gold);
    letter-spacing: 1px;
    margin-top: -4px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }

  .badge {
    display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: 3px;
    color: var(--sand); border: 1px solid rgba(212,163,89,0.3); background: rgba(212,163,89,0.06);
    border-radius: 20px; padding: 5px 16px; margin-bottom: 14px; text-transform: uppercase; margin-top: 10px;
  }
  .hero p { font-size: 13px; color: var(--muted); max-width: 440px; margin: 0 auto; line-height: 1.6; }

  .api-notice {
    width: 100%; max-width: 640px; background: rgba(74,163,223,0.04); border: 1px solid rgba(74,163,223,0.15);
    border-radius: 10px; padding: 14px 18px; font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 20px;
  }
  .api-notice strong { color: var(--sky); }
  .api-notice a { color: var(--gold); text-decoration: none; }
  .api-key-row { display: flex; gap: 8px; margin-top: 8px; }
  .api-key-row input {
    flex: 1; background: var(--night); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 12px; font-family: var(--mono); font-size: 12px; color: var(--text); outline: none;
  }
  .api-key-row button {
    background: var(--sky-dark); border: none; border-radius: 6px; padding: 7px 14px;
    font-size: 12px; font-weight: 600; color: #fff; cursor: pointer; transition: background 0.2s;
  }
  .api-key-row button:hover { background: var(--sky); }

  .checker-box {
    width: 100%; max-width: 640px; background: var(--night2); border: 1px solid var(--border);
    border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .input-group { display: flex; flex-direction: column; gap: 6px; }
  .search-label { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; color: var(--text); text-transform: uppercase; display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .search-label img { width: 18px; height: 18px; object-fit: contain; }
  
  .checker-box input {
    width: 100%; background: var(--night); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-family: var(--mono); font-size: 13px; color: var(--text); outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .checker-box input:focus { border-color: var(--sand); box-shadow: 0 0 0 3px rgba(212,163,89,0.15); }
  
  .run-btn {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
    border: none; border-radius: 8px; padding: 13px 24px; font-size: 13px; font-weight: 600;
    color: var(--wood); cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 1.5px;
    transition: filter 0.2s, transform 0.1s; margin-top: 4px;
  }
  .run-btn:hover { filter: brightness(1.1); }
  .run-btn:active { transform: scale(0.99); }
  .run-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  #result { width: 100%; max-width: 680px; margin-top: 20px; }
  .card { background: var(--night2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
  .card-accent { border-top: 2px solid var(--gold); }
  .profile-header { display: flex; align-items: center; gap: 20px; padding: 22px 24px; border-bottom: 1px solid var(--border); }
  .avatar-wrap img { width: 68px; height: 68px; border-radius: 8px; border: 2px solid var(--gold); }
  .profile-info h2 { font-family: var(--serif); font-size: 20px; color: #fff; margin-bottom: 4px; }
  .profile-info .steamid { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 5px; }
  .profile-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .profile-links a { font-family: var(--mono); font-size: 11px; color: var(--sky); text-decoration: none; background: rgba(74,163,223,0.08); border: 1px solid rgba(74,163,223,0.2); padding: 5px 10px; border-radius: 4px; transition: background 0.2s; }
  .profile-links a:hover { background: rgba(74,163,223,0.2); }

  .section-title { font-family: var(--mono); font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--sand); padding: 14px 24px 6px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .stat-cell { padding: 14px 20px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .stat-cell:last-child { border-right: none; }
  .stat-label { font-family: var(--mono); font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .stat-value { font-size: 15px; font-weight: 700; color: #fff; }
  .stat-value.danger { color: var(--danger); }
  .stat-value.warn   { color: var(--warn);   }
  .stat-value.ok     { color: var(--ok);     }

  .ban-alert { margin: 0 24px 20px; border-radius: 8px; padding: 14px 18px; display: flex; align-items: flex-start; gap: 12px; font-size: 13px; line-height: 1.6; }
  .ban-alert.warn { background: rgba(232,168,50,0.08); border: 1px solid rgba(232,168,50,0.25); color: #f0c060; }
  
  /* Animazione e Stile per l'allarme rosso lampeggiante */
  @keyframes flashRed {
    0% { background: rgba(232, 64, 64, 0.2); border-color: rgba(232, 64, 64, 0.5); }
    50% { background: rgba(232, 64, 64, 0.7); border-color: rgba(232, 64, 64, 1); box-shadow: 0 0 20px rgba(232, 64, 64, 0.6); }
    100% { background: rgba(232, 64, 64, 0.2); border-color: rgba(232, 64, 64, 0.5); }
  }

  .flash-alert-box {
    margin: 16px 24px 20px;
    border-radius: 8px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    animation: flashRed 1.2s infinite ease-in-out;
    border: 2px solid var(--danger);
  }

  .verdict-card { border-radius: 12px; padding: 26px 24px; text-align: center; }
  .verdict-card.danger { background: rgba(232,64,64,0.08); border: 1px solid rgba(232,64,64,0.3); }
  .verdict-card.warn   { background: rgba(232,168,50,0.07); border: 1px solid rgba(232,168,50,0.28); }
  .verdict-card.ok     { background: rgba(78,201,123,0.06); border: 1px solid rgba(78,201,123,0.25); }
  .verdict-card .v-title { font-family: var(--serif); font-size: 20px; font-weight: 700; margin-bottom: 6px; }
  .verdict-card.danger .v-title { color: var(--danger); }
  .verdict-card.warn   .v-title { color: var(--warn);   }
  .verdict-card.ok     .v-title { color: var(--ok);     }
  .verdict-card .v-desc { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 460px; margin: 0 auto; }
  .valley-stamp { margin-top: 14px; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--sand); opacity: 0.6; text-transform: uppercase; }

  .status-msg { font-family: var(--mono); font-size: 13px; color: var(--muted); padding: 28px; text-align: center; background: var(--night2); border: 1px solid var(--border); border-radius: 12px; }
  .status-msg.error { color: var(--danger); border-color: rgba(232,64,64,0.3); }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="mainContent">
  <div class="hero">
    <div class="logo-container">
      <div class="logo-text">Valley</div>
      <div class="logo-sub">Sandy Shores &amp; Paleto Bay</div>
    </div>
    <div class="badge">Staff Security Console</div>
    <p>Strumento unificato di controllo incrociato e analisi profili per lo staff.</p>
  </div>

  <div class="api-notice">
    <strong>Configurazione iniziale:</strong> Inserisci la tua Steam Web API Key (<a href="https://steamcommunity.com/dev/apikey" target="_blank">ottienila qui</a>).
    <div class="api-key-row">
      <input type="text" id="apiKeyInput" placeholder="Inserisci Steam Web API Key…" maxlength="64"/>
      <button onclick="saveKey()">Salva</button>
    </div>
  </div>

  <div class="checker-box">
    <div class="input-group">
      <label class="search-label">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Steam_icon_logo.svg" alt="Steam Logo"> 
        SteamID64 / FiveM Hex / Profilo
      </label>
      <input type="text" id="steamInput" placeholder="Es. 76561198... / 1100001..." />
    </div>

    <div class="input-group">
      <label class="search-label">
        <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" alt="Discord Logo"> 
        ID Discord Utente
      </label>
      <input type="text" id="discordInput" placeholder="Es. 123456789012345678" maxlength="20" />
    </div>

    <button id="searchBtn" class="run-btn" onclick="doCompleteCheck()">Avvia Analisi Completa</button>
  </div>

  <div id="result">
    <div class="status-msg">In attesa dei dati utente per avviare il controllo…</div>
  </div>
</div>

<script>
let API_KEY = localStorage.getItem('valley_steam_key') || '';
if (API_KEY) {
  const inputEl = document.getElementById('apiKeyInput');
  if (inputEl) inputEl.value = API_KEY;
}

function saveKey() {
  const inputEl = document.getElementById('apiKeyInput');
  if (!inputEl) return;
  const val = inputEl.value.trim();
  if (!val) return;
  API_KEY = val;
  try {
    localStorage.setItem('valley_steam_key', API_KEY);
  } catch(e) {}
  alert('✓ API Key salvata correttamente!');
}

function showMsg(txt, err) {
  document.getElementById('result').innerHTML = `<div class="status-msg ${err?'error':''}">${txt}</div>`;
}

function showLoading(txt) {
  document.getElementById('result').innerHTML = `<div class="status-msg"><span class="spinner"></span>${txt}</div>`;
}

async function resolveId(raw) {
  raw = raw.trim();
  if (/^\d{17}$/.test(raw)) return raw;
  if (/^1100001[0-9a-f]{8}$/i.test(raw)) return BigInt('0x' + raw).toString();
  let m = raw.match(/profiles\/(\d{17})/);
  if (m) return m[1];
  m = raw.match(/id\/([^\/\?]+)/);
  const vanity = m ? m[1] : raw;
  
  const targetUrl = `https://api.steampowered.com/ISteamUser/ResolveVanityURL/v0001/?key=${API_KEY}&vanityurl=${encodeURIComponent(vanity)}&format=json`;
  const r = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`);
  const d = await r.json();
  
  if (!d.response || d.response.success !== 1) throw new Error('Profilo Steam non trovato.');
  return d.response.steamid;
}

async function doCompleteCheck() {
  const rawSteam = document.getElementById('steamInput').value.trim();
  const rawDiscord = document.getElementById('discordInput').value.trim();

  if (!rawSteam || !rawDiscord) {
    showMsg('⚠ Compila entrambi i campi (Steam e Discord) per procedere.', true);
    return;
  }
  if (!API_KEY) {
    showMsg('⚠ Inserisci prima la tua Steam Web API Key.', true);
    return;
  }
  if (!/^\d{17,19}$/.test(rawDiscord)) {
    showMsg('⚠ ID Discord non valido (deve contenere tra 17 e 19 cifre).', true);
    return;
  }

  const btn = document.getElementById('searchBtn');
  if (btn) btn.disabled = true;

  try {
    showLoading('Analisi profili e controllo incrociato in corso…');
    
    const sid = await resolveId(rawSteam);
    const [sumRes, banRes] = await Promise.all([
      fetch(`https://corsproxy.io/?${encodeURIComponent(`https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v0002/?key=${API_KEY}&steamids=${sid}&format=json`)}`),
      fetch(`https://corsproxy.io/?${encodeURIComponent(`https://api.steampowered.com/ISteamUser/GetPlayerBans/v1/?key=${API_KEY}&steamids=${sid}&format=json`)}`)
    ]);
    
    const sumData = await sumRes.json();
    const banData = await banRes.json();
    
    const p = sumData.response.players[0];
    const b = banData.players[0];
    if (!p) throw new Error('Profilo Steam non trovato.');

    const DISCORD_EPOCH = 1420070400000n;
    const discordTimestamp = Number((BigInt(rawDiscord) >> 22n) + DISCORD_EPOCH);
    const discordDate = new Date(discordTimestamp);
    
    const steamCreatedDate = p.timecreated ? new Date(p.timecreated * 1000) : null;

    let mismatchDetected = false;
    if (steamCreatedDate) {
      const diffDays = (discordDate.getTime() - steamCreatedDate.getTime()) / (1000 * 60 * 60 * 24);
      // Se l'account Discord è recente ma Steam è molto vecchio (gap > 3 anni)
      if (diffDays > 1095) {
        mismatchDetected = true;
      }
    }

    let games = null;
    try {
      const gdRes = await fetch(`https://corsproxy.io/?${encodeURIComponent(`https://api.steampowered.com/IPlayerService/GetOwnedGames/v0001/?key=${API_KEY}&steamid=${sid}&include_appinfo=1&include_played_free_games=1&format=json`)}`);
      const gd = await gdRes.json();
      games = gd.response.games || [];
    } catch(e) {}
    
    renderResults(p, b, games, sid, discordDate, rawDiscord, mismatchDetected);

  } catch(e) {
    showMsg(e.message, true);
  }

  if (btn) btn.disabled = false;
}

function renderResults(p, b, games, sid, discordDate, discordId, mismatchDetected) {
  const steamCreatedDate = p.timecreated ? new Date(p.timecreated * 1000) : null;
  const steamCreatedStr = steamCreatedDate ? steamCreatedDate.toLocaleDateString('it-IT', {day:'2-digit', month:'long', year:'numeric'}) : 'N/D';
  
  let steamAgeText = 'N/D';
  if (steamCreatedDate) {
    const now = new Date();
    let years = now.getFullYear() - steamCreatedDate.getFullYear();
    let months = now.getMonth() - steamCreatedDate.getMonth();
    if (months < 0 || (months === 0 && now.getDate() < steamCreatedDate.getDate())) { years--; months += 12; }
    let parts = [];
    if (years > 0) parts.push(years + (years === 1 ? ' anno' : ' anni'));
    if (months > 0) parts.push(months + (months === 1 ? ' mese' : ' mesi'));
    steamAgeText = parts.length > 0 ? parts.join(' e ') : 'Meno di un mese';
  }

  const discordCreatedStr = discordDate.toLocaleDateString('it-IT', {day:'2-digit', month:'long', year:'numeric'});
  const now = new Date();
  let dYears = now.getFullYear() - discordDate.getFullYear();
  let dMonths = now.getMonth() - discordDate.getMonth();
  if (dMonths < 0 || (dMonths === 0 && now.getDate() < discordDate.getDate())) { dYears--; dMonths += 12; }
  let dParts = [];
  if (dYears > 0) dParts.push(dYears + (dYears === 1 ? ' anno' : ' anni'));
  if (dMonths > 0) dParts.push(dMonths + (dMonths === 1 ? ' mese' : ' mesi'));
  let discordAgeText = dParts.length > 0 ? dParts.join(' e ') : 'Meno di un mese';
  const discordAgeWarn = (dYears === 0 && dMonths < 2);

  const hasBan = b.VACBanned || b.NumberOfGameBans > 0;
  const daysBan = b.DaysSinceLastBan;
  const isPublic = p.communityvisibilitystate === 3;
  let totalHours = games ? Math.round(games.reduce((s,g)=>s+g.playtime_forever,0)/60).toLocaleString('it-IT') + ' ore' : 'N/D';

  const hexId = BigInt(sid).toString(16);
  const decId = sid;
  const cfxSearchUrl = `https://forum.cfx.re/search?q=${hexId}`;
  const steamIdIoUrl = `https://steamid.io/lookup/${sid}`;

  let verdict = { title: 'PROFILO PULITO', desc: 'Nessun ban rilevato e account regolari.', cls: 'ok' };
  if (mismatchDetected) {
    verdict = { title: 'DISCREPANZA CRITICA', desc: 'Rilevato forte scostamento temporale tra Steam e Discord.', cls: 'danger' };
  } else if (hasBan) {
    verdict = daysBan < 180 ? { title: 'RISCHIO ALTO', desc: `Ban recente su Steam (${daysBan} giorni fa). Sconsigliato.`, cls: 'danger' } : { title: 'ATTENZIONE', desc: `Ban storico su Steam registrato ${daysBan} giorni fa.`, cls: 'warn' };
  } else if (!isPublic) {
    verdict = { title: 'PROFILO PRIVATO', desc: 'Impossibile verificare ore e storico Steam in modo completo.', cls: 'warn' };
  } else if (discordAgeWarn) {
    verdict = { title: 'DISCORD RECENTE', desc: 'L\'account Discord analizzato ha meno di 2 mesi di vita.', cls: 'warn' };
  }

  document.getElementById('result').innerHTML = `
    <div class="card card-accent">
      <div class="profile-header">
        <div class="avatar-wrap"><img src="${p.avatarmedium}" alt="avatar"/></div>
        <div class="profile-info">
          <h2>${esc(p.personaname)}</h2>
          <div class="steamid">HEX: ${hexId} | STEAMID64: ${decId}</div>
          <div class="profile-links">
            <a href="https://steamcommunity.com/profiles/${sid}" target="_blank">🔗 Steam</a>
            <a href="${cfxSearchUrl}" target="_blank">💬 Cfx Forum</a>
            <a href="${steamIdIoUrl}" target="_blank">🛡️ SteamID.io</a>
          </div>
        </div>
      </div>
      
      ${mismatchDetected ? `<div class="flash-alert-box">⚠ ATTENZIONE: Steam molto vecchio ma Discord recente.</div>` : ''}

      <div class="section-title">Anagrafica Piattaforme</div>
      <div class="stat-grid">
        <div class="stat-cell"><div class="stat-label">Steam Creato</div><div class="stat-value" style="font-size:12px">${steamCreatedStr}</div></div>
        <div class="stat-cell"><div class="stat-label">Età Steam</div><div class="stat-value" style="font-size:13px">${steamAgeText}</div></div>
        <div class="stat-cell"><div class="stat-label">Discord Creato</div><div class="stat-value" style="font-size:12px">${discordCreatedStr}</div></div>
        <div class="stat-cell"><div class="stat-label">Età Discord</div><div class="stat-value ${discordAgeWarn?'warn':''}" style="font-size:13px">${discordAgeText}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Analisi Dettagliata Account Discord</div>
      <div class="stat-grid">
        <div class="stat-cell" style="grid-column: span 2"><div class="stat-label">ID Discord Utente</div><div class="stat-value" style="font-size:13px; font-family:var(--mono)">${discordId}</div></div>
        <div class="stat-cell"><div class="stat-label">Età Account</div><div class="stat-value ${discordAgeWarn?'warn':'ok'}" style="font-size:13px">${discordAgeText}</div></div>
        <div class="stat-cell">
          <div class="stat-label">Azione Rapida</div>
          <div class="stat-value" style="font-size:12px">
            <a href="https://discord.com/users/${discordId}" target="_blank" style="color:var(--sky); text-decoration:none; display:inline-flex; align-items:center; gap:4px; background:rgba(74,163,223,0.1); border:1px solid rgba(74,163,223,0.25); padding:4px 10px; border-radius:4px;">Apri Profilo ↗</a>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Reputazione & Sicurezza Steam</div>
      <div class="stat-grid">
        <div class="stat-cell"><div class="stat-label">Visibilità</div><div class="stat-value ${isPublic?'ok':'warn'}">${isPublic?'Pubblico':'Privato'}</div></div>
        <div class="stat-cell"><div class="stat-label">VAC Ban</div><div class="stat-value ${b.VACBanned?'danger':'ok'}">${b.VACBanned?'SÌ':'NO'}</div></div>
        <div class="stat-cell"><div class="stat-label">Game Ban</div><div class="stat-value ${b.NumberOfGameBans>0?'danger':'ok'}">${b.NumberOfGameBans}</div></div>
        <div class="stat-cell"><div class="stat-label">Ore Registrate</div><div class="stat-value" style="font-size:13px">${totalHours}</div></div>
      </div>
    </div>

    <div class="verdict-card ${verdict.cls}">
      <div class="v-title">${verdict.title}</div>
      <div class="v-desc">${verdict.desc}</div>
      <div class="valley-stamp">Valley RP Staff Security Tool</div>
    </div>
  `;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
