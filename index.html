<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valley RP - Staff Security Console</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #131b2e;
            --accent-color: #e0a838;
            --accent-hover: #f0b848;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f293d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 90px;
            height: 90px;
            background: #1a233a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(224, 168, 56, 0.2);
        }

        .logo span {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        label svg {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        label a {
            color: var(--accent-color);
            text-decoration: none;
        }

        label a:hover {
            text-decoration: underline;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0b0f19;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
            width: auto;
            display: inline-block;
            margin-top: 8px;
        }

        #resultArea {
            margin-top: 20px;
        }

        .msg-box {
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
        }

        .msg-error {
            background-color: rgba(232, 64, 64, 0.15);
            border: 1px solid rgba(232, 64, 64, 0.4);
            color: #ff6b6b;
        }

        .msg-loading {
            background-color: rgba(224, 168, 56, 0.1);
            border: 1px solid rgba(224, 168, 56, 0.3);
            color: var(--accent-color);
        }

        .result-card {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .result-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
        }

        .result-title h3 {
            font-size: 1.1rem;
            margin-bottom: 3px;
        }

        .result-title span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .info-item {
            background: #131b2e;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .info-item span {
            display: block;
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 3px;
        }

        .verdict {
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9rem;
            text-align: center;
        }

        .verdict.clean {
            background: rgba(78, 201, 123, 0.15);
            border: 1px solid rgba(78, 201, 123, 0.4);
            color: #4ec97b;
        }

        .verdict.warning {
            background: rgba(232, 168, 50, 0.15);
            border: 1px solid rgba(232, 168, 50, 0.4);
            color: #e8a832;
        }

        .verdict.danger {
            background: rgba(232, 64, 64, 0.15);
            border: 1px solid rgba(232, 64, 64, 0.4);
            color: #e84040;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">
                <span>VALLEY</span>
            </div>
            <h1>STAFF SECURITY CONSOLE</h1>
            <p class="subtitle">Strumento unificato di controllo incrociato e analisi profili per lo staff.</p>
        </header>

        <!-- Configurazione API Key -->
        <div class="card">
            <div class="form-group" style="margin-bottom: 0;">
                <label>
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                    Configurazione Iniziale: Inserisci la tua Steam Web API Key (<a href="https://steamcommunity.com/dev/apikey" target="_blank">ottienila qui</a>)
                </label>
                <div style="display: flex; gap: 10px;">
                    <input type="password" id="apiKeyInput" placeholder="Inserisci Steam Web API Key..." style="flex: 1;">
                    <button class="btn btn-small" onclick="saveApiKey()">Salva</button>
                </div>
            </div>
        </div>

        <!-- Form di Ricerca -->
        <div class="card">
            <div class="form-group">
                <label>
                    <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-9.95 9.14L7.8 13.5a3.5 3.5 0 0 1 2.2-1.07l2.87-4.16a4 4 0 0 1 .13-.57l-3.3-2.42A10 10 0 0 1 12 2m5.75 3.5a2.25 2.25 0 1 0 2.25 2.25 2.25 2.25 0 0 0-2.25-2.25M6.5 13.75A3.25 3.25 0 0 0 9.75 17L12 21.5A9.5 9.5 0 0 0 21.5 12a9.5 9.5 0 0 0-9.21-9.5l-3.2 4.47a3.25 3.25 0 0 0-2.59 6.78Z"/></svg>
                    SteamID64 / FiveM HEX / Profilo
                </label>
                <input type="text" id="steamInput" placeholder="es. https://steamcommunity.com/id/... oppure HEX">
            </div>

            <div class="form-group">
                <label>
                    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
                    ID Discord Utente
                </label>
                <input type="text" id="discordInput" placeholder="es. 17-19 cifre (es. 29384758934857)">
            </div>

            <button class="btn" id="searchBtn" onclick="doCompleteCheck()">AVVIA ANALISI COMPLETA</button>
        </div>

        <!-- Area Risultati -->
        <div id="resultArea"></div>
    </div>

    <script>
        let API_KEY = localStorage.getItem('valley_steam_api_key') || '';
        
        window.addEventListener('DOMContentLoaded', () => {
            if (API_KEY) {
                document.getElementById('apiKeyInput').value = API_KEY;
            }
        });

        function saveApiKey() {
            const val = document.getElementById('apiKeyInput').value.trim();
            if (!val) {
                alert('Inserisci una chiave valida.');
                return;
            }
            API_KEY = val;
            localStorage.setItem('valley_steam_api_key', API_KEY);
            alert('API Key salvata con successo!');
        }

        function showMsg(text, isError = false) {
            const area = document.getElementById('resultArea');
            area.innerHTML = `<div class="msg-box ${isError ? 'msg-error' : 'msg-loading'}">${text}</div>`;
        }

        function showLoading(text) {
            showMsg(text, false);
        }

        async function fetchSteamApi(targetUrl) {
            // Utilizziamo CodeTabs come proxy CORS alternativo e stabile
            const proxyUrl = `https://api.codetabs.com/v1/proxy?quest=` + encodeURIComponent(targetUrl);
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error(`Errore di comunicazione con i server Steam (HTTP ${response.status})`);
            return await response.json();
        }

        async function resolveId(raw) {
            raw = raw.trim();
            if (/^\d{17}$/.test(raw)) return raw;
            if (/^1100001[0-9a-f]{8}$/i.test(raw)) return BigInt('0x' + raw).toString();
            let m = raw.match(/profiles\/(\d{17})/);
            if (m) return m[1];
            m = raw.match(/id\/([^\/\?]+)/);
            const vanity = m ? m[1] : raw;
            
            const targetUrl = `https://api.steampowered.com/ISteamUser/ResolveVanityURL/v0001/?key=${API_KEY}&vanityurl=${encodeURIComponent(vanity)}&format=json`;
            const d = await fetchSteamApi(targetUrl);
            
            if (!d.response || d.response.success !== 1) throw new Error('Profilo Steam non trovato o Vanity URL non valido.');
            return d.response.steamid;
        }

        async function doCompleteCheck() {
            const rawSteam = document.getElementById('steamInput').value.trim();
            const rawDiscord = document.getElementById('discordInput').value.trim();

            if (!rawSteam || !rawDiscord) {
                showMsg('⚠ Compila entrambi i campi (Steam e Discord) per procedere.', true);
                return;
            }
            if (!API_KEY) {
                showMsg('⚠ Inserisci prima la tua Steam Web API Key.', true);
                return;
            }
            if (!/^\d{17,19}$/.test(rawDiscord)) {
                showMsg('⚠ ID Discord non valido (deve contenere tra 17 e 19 cifre).', true);
                return;
            }

            const btn = document.getElementById('searchBtn');
            if (btn) btn.disabled = true;

            try {
                showLoading('Analisi profili e controllo incrociato in corso…');
                
                const sid = await resolveId(rawSteam);
                
                const urlSum = `https://api.steampowered.com/ISteamUser/GetPlayerSummaries/v0002/?key=${API_KEY}&steamids=${sid}&format=json`;
                const urlBan = `https://api.steampowered.com/ISteamUser/GetPlayerBans/v1/?key=${API_KEY}&steamids=${sid}&format=json`;

                const [sumData, banData] = await Promise.all([
                    fetchSteamApi(urlSum),
                    fetchSteamApi(urlBan)
                ]);
                
                const p = sumData.response.players[0];
                const b = banData.players[0];
                if (!p) throw new Error('Profilo Steam non trovato o API Key non valida.');

                const DISCORD_EPOCH = 1420070400000n;
                const discordTimestamp = Number((BigInt(rawDiscord) >> 22n) + DISCORD_EPOCH);
                const discordDate = new Date(discordTimestamp);
                
                const steamCreatedDate = p.timecreated ? new Date(p.timecreated * 1000) : null;

                let mismatchDetected = false;
                if (steamCreatedDate) {
                    const diffDays = Math.abs(discordDate.getTime() - steamCreatedDate.getTime()) / (1000 * 60 * 60 * 24);
                    if (diffDays > 1095) {
                        mismatchDetected = true;
                    }
                }

                let games = null;
                try {
                    const urlGames = `https://api.steampowered.com/IPlayerService/GetOwnedGames/v0001/?key=${API_KEY}&steamid=${sid}&include_appinfo=1&include_played_free_games=1&format=json`;
                    const gd = await fetchSteamApi(urlGames);
                    games = gd.response.games || [];
                } catch(e) {}
                
                renderResults(p, b, games, sid, discordDate, rawDiscord, mismatchDetected);

            } catch(e) {
                showMsg(e.message, true);
            }

            if (btn) btn.disabled = false;
        }

        function renderResults(p, b, games, sid, discordDate, rawDiscord, mismatchDetected) {
            const area = document.getElementById('resultArea');
            
            const steamDateStr = p.timecreated ? new Date(p.timecreated * 1000).toLocaleDateString('it-IT') : 'N/D';
            const discordDateStr = discordDate.toLocaleDateString('it-IT');
            const hexId = BigInt(sid).toString(16);
            
            let totalHours = 'N/D';
            if (games) {
                const totalMins = games.reduce((acc, g) => acc + g.playtime_forever, 0);
                totalHours = Math.round(totalMins / 60).toLocaleString('it-IT') + ' ore';
            }

            const hasBan = b.VACBanned || b.NumberOfGameBans > 0;
            let verdictClass = 'clean';
            let verdictText = 'Profilo regolare e pulito.';

            if (hasBan) {
                verdictClass = 'danger';
                verdictText = `⚠ ATTENZIONE: Trovati ban su Steam (VAC: ${b.VACBanned ? 'Sì' : 'No'}, Game Bans: ${b.NumberOfGameBans})`;
            } else if (mismatchDetected) {
                verdictClass = 'warning';
                verdictText = '⚠ ATTENZIONE: Notevole differenza temporale tra la creazione di Steam e Discord.';
            }

            area.innerHTML = `
                <div class="result-card">
                    <div class="result-header">
                        <img src="${p.avatarmedium}" alt="Avatar" class="result-avatar">
                        <div class="result-title">
                            <h3>${p.personaname}</h3>
                            <span>SteamID: ${sid}</span>
                        </div>
                    </div>
                    <div class="info-grid">
                        <div class="info-item">
                            <span>CREAZIONE STEAM</span>
                            <strong>${steamDateStr}</strong>
                        </div>
                        <div class="info-item">
                            <span>CREAZIONE DISCORD</span>
                            <strong>${discordDateStr}</strong>
                        </div>
                        <div class="info-item">
                            <span>HEX FIVE-M</span>
                            <strong style="font-size:0.75rem; word-break:break-all;">${hexId}</strong>
                        </div>
                        <div class="info-item">
                            <span>ORE DI GIOCO TOT</span>
                            <strong>${totalHours}</strong>
                        </div>
                    </div>
                    <div class="verdict ${verdictClass}">
                        ${verdictText}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
